    function timeAgo(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
      return Math.floor(diff / 604800) + 'w ago';

    function buildActivityMap() {
      const container = document.getElementById('activity-map');
      const monthLabels = document.getElementById('month-labels');
      const tooltip = document.getElementById('tooltip');
      const startDate = new Date('2026-02-06');
      const endDate = new Date('2026-06-16');
      const cellWidth = 11;
      const allDays = [];
      const current = new Date(startDate);

      while (current <= endDate) {
        const dateStr = current.toISOString().split('T')[0];
        allDays.push({ date: dateStr, count: pushEventsByDate[dateStr] || 0, month: current.getMonth() });
        current.setDate(current.getDate() + 1);
      }

      monthLabels.innerHTML = '';
      let currentMonth = -1, monthStartIndex = 0;
      allDays.forEach((day, i) => {
        if (day.month !== currentMonth) {
          if (currentMonth !== -1) {
            const span = document.createElement('span');
            span.textContent = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][currentMonth];
            span.style.position = 'absolute';
            span.style.left = monthStartIndex * cellWidth + 'px';
            span.className = 'text-xs text-gray-500';
            monthLabels.appendChild(span);
          }
          currentMonth = day.month;
          monthStartIndex = i;
        }
      });
      const lastSpan = document.createElement('span');
      lastSpan.textContent = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][currentMonth];
      lastSpan.style.position = 'absolute';
      lastSpan.style.left = monthStartIndex * cellWidth + 'px';
      lastSpan.className = 'text-xs text-gray-500';
      monthLabels.appendChild(lastSpan);
      monthLabels.style.position = 'relative';
      monthLabels.style.height = '16px';

      container.innerHTML = '';
      allDays.forEach(day => {
        const div = document.createElement('div');
        div.className = 'w-2.5 h-2.5 rounded-sm activity-cell ' + getActivityColor(day.count);
        div.addEventListener('mouseenter', (e) => {
          const date = new Date(day.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          const commits = day.count === 1 ? '1 commit' : day.count + ' commits';
          tooltip.textContent = date + ' — ' + commits;
          tooltip.classList.add('visible');
          const rect = div.getBoundingClientRect();
          tooltip.style.left = (rect.left + rect.width / 2 - tooltip.offsetWidth / 2) + 'px';
          tooltip.style.top = (rect.top - tooltip.offsetHeight - 5) + 'px';
        });
        div.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
        container.appendChild(div);
      });

      const totalStars = allReposData.reduce((sum, r) => sum + r.stars, 0);
      const totalIssues = allReposData.reduce((sum, r) => sum + r.issues, 0);
      document.getElementById('repo-count').textContent = allReposData.length;
      document.getElementById('star-count').textContent = totalStars;
      document.getElementById('issue-count').textContent = totalIssues;
      document.getElementById('commit-count').textContent = totalContributions.toLocaleString();
    }

    function buildActiveRepos() {
      const container = document.getElementById('active-repos');
      activeReposData.forEach(repo => {
        const card = document.createElement('a');
        card.href = repo.url;
        card.target = '_blank';
        card.className = 'repo-card block px-2 py-1.5 rounded-lg bg-white/5 border border-white/5 hover:border-blue-500/30';

        const langHtml = repo.lang ? '<span class="w-1.5 h-1.5 rounded-full ' + esc(langColor(repo.lang)) + '"></span><span class="text-xs text-gray-400">' + esc(repo.lang) + '</span>' : '';
        const privateBadge = repo.private ? '<span class="text-xs px-1 py-0.5 rounded bg-yellow-500/20 text-yellow-400">🔒</span>' : '';

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="text-xs font-medium text-blue-400 truncate">${esc(repo.name)}</span>
              ${privateBadge}
            </div>
            <span class="text-xs text-gray-500 flex-shrink-0 ml-1">${esc(timeAgo(repo.pushed))}</span>
          </div>
          ${repo.desc ? '<p class="text-xs text-gray-500 truncate mt-0.5">' + esc(repo.desc) + '</p>' : ''}
          ${langHtml ? '<div class="flex items-center gap-1 mt-1">' + langHtml + '</div>' : ''}
        `;
        container.appendChild(card);
      });
    }

    function buildTrending() {
      const container = document.getElementById('trending');
      trendingData.forEach(repo => {
        const card = document.createElement('a');
        card.href = 'https://github.com/' + repo.name;
        card.target = '_blank';
        card.className = 'trend-card flex items-center gap-2 p-2 rounded-lg bg-white/5 border border-white/5';
        card.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-medium text-white truncate">${esc(repo.name.split('/')[1])}</span>
            </div>
            <div class="flex items-center gap-2 mt-0.5">
              <div class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full ${repo.langColor}"></span><span class="text-xs text-gray-500">${esc(repo.lang)}</span></div>
              <div class="flex items-center gap-0.5 text-yellow-400"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span class="text-xs">${esc(repo.stars)}</span></div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    buildActivityMap();
    buildActiveRepos();
    buildTrending();

    document.getElementById('btn-refresh').addEventListener('click', () => {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('spin');
      buildActivityMap();
      buildActiveRepos();
      buildTrending();
      setTimeout(() => icon.classList.remove('spin'), 800);
    });

    document.getElementById('btn-minimize').addEventListener('click', () => window.electronAPI.minimize());
    document.getElementById('btn-close').addEventListener('click', () => window.electronAPI.close());
  </script>
</body>
</html>
