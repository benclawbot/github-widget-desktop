<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Widget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { position: relative; font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%); }
    .title-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; -webkit-app-region: drag; }
    .title-bar button, .title-bar a { -webkit-app-region: no-drag; }
    .scroll-content { position: fixed; top: 41px; left: 0; right: 0; bottom: 0; overflow-y: auto; }
    .glass { background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .activity-cell { transition: all 0.15s ease; cursor: pointer; }
    .activity-cell:hover { transform: scale(1.5); box-shadow: 0 0 12px rgba(88, 166, 255, 0.7); z-index: 10; position: relative; }
    .repo-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .repo-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4); border-color: rgba(88, 166, 255, 0.3); }
    .trend-card { transition: all 0.2s ease; }
    .trend-card:hover { transform: translateX(4px); background: rgba(255, 255, 255, 0.03); }
    .tooltip { pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 2147483647; }
    .tooltip.visible { opacity: 1; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }
    .config-panel { display: none; }
    .config-panel.open { display: flex; }
  </style>
</head>
<body class="text-white">

  <!-- Custom Title Bar -->
  <div class="title-bar flex items-center justify-between px-4 py-2 bg-[#0d1117]/95 border-b border-white/5">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-md bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
      </div>
      <span class="text-sm font-medium text-gray-300">GitHub Widget</span>
    </div>
    <div class="flex items-center gap-1">
      <button id="btn-config" class="w-8 h-8 flex items-center justify-center rounded hover:bg-white/10 text-gray-400 hover:text-white transition-colors" title="Settings">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
      <button id="btn-refresh" class="w-8 h-8 flex items-center justify-center rounded hover:bg-white/10 text-gray-400 hover:text-white transition-colors" title="Refresh">
        <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
      <button id="btn-minimize" class="w-8 h-8 flex items-center justify-center rounded hover:bg-white/10 text-gray-400 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
        </svg>
      </button>
      <button id="btn-close" class="w-8 h-8 flex items-center justify-center rounded hover:bg-red-500/20 text-gray-400 hover:text-red-400 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Settings Panel -->
  <div id="config-panel" class="config-panel fixed inset-0 z-[200] bg-black/80 items-center justify-center">
    <div class="glass rounded-xl p-5 w-80 max-w-[90vw]">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-white">Settings</h2>
        <button id="btn-config-close" class="w-6 h-6 flex items-center justify-center rounded hover:bg-white/10 text-gray-400 hover:text-white">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">GitHub Username</label>
          <input id="input-username" type="text" placeholder="benclawbot" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">GitHub Token <span class="text-gray-500">(optional, for higher rate limits)</span></label>
          <input id="input-token" type="password" placeholder="ghp_..." class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50">
        </div>
        <p class="text-xs text-gray-500">Token needs no scopes for public repos. Get one at GitHub → Settings → Developer Settings → Personal Access Tokens.</p>
        <button id="btn-save-config" class="w-full py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-sm font-medium text-white transition-colors">Save & Refresh</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="scroll-content p-3 space-y-3">

    <!-- Main Grid -->
    <div class="flex flex-col gap-3">

      <!-- Activity Map -->
      <div class="glass rounded-xl p-3 flex-shrink-0">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-medium text-gray-300">Activity Overview</h2>
          <span id="activity-dates" class="text-xs text-gray-500">--</span>
        </div>
        <div id="activity-container">
          <div id="month-labels" class="flex h-4 mb-1"></div>
          <div id="activity-map" class="flex flex-wrap gap-1"></div>
        </div>
        <div id="tooltip" class="tooltip fixed px-2 py-1 rounded bg-[#1c2128] text-xs text-white border border-white/10"></div>
        <div class="flex items-center justify-end gap-1 mt-2">
          <span class="text-xs text-gray-500">Less</span>
          <div class="flex gap-0.5">
            <div class="w-2.5 h-2.5 rounded-sm bg-[#161b22]"></div>
            <div class="w-2.5 h-2.5 rounded-sm bg-emerald-900"></div>
            <div class="w-2.5 h-2.5 rounded-sm bg-emerald-700"></div>
            <div class="w-2.5 h-2.5 rounded-sm bg-emerald-500"></div>
            <div class="w-2.5 h-2.5 rounded-sm bg-emerald-400"></div>
          </div>
          <span class="text-xs text-gray-500">More</span>
        </div>
      </div>

      <!-- Active Repos -->
      <div class="glass rounded-xl p-3 flex-shrink-0">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-medium text-gray-300">Active This Week</h2>
          <span id="active-count" class="text-xs px-1.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">--</span>
        </div>
        <div id="active-repos" class="space-y-1 overflow-y-auto" style="max-height: 160px;"></div>
      </div>

      <!-- Stats Summary -->
      <div class="glass rounded-xl p-3">
        <h2 class="text-xs font-medium text-gray-300 mb-2">Quick Stats</h2>
        <div class="grid grid-cols-2 gap-2">
          <div class="flex items-center justify-between p-2 rounded-lg bg-white/5">
            <span class="text-xs text-gray-400">Repos</span>
            <span id="repo-count" class="text-sm font-semibold">--</span>
          </div>
          <div class="flex items-center justify-between p-2 rounded-lg bg-white/5">
            <span class="text-xs text-gray-400">Stars</span>
            <span id="star-count" class="text-sm font-semibold">--</span>
          </div>
          <div class="flex items-center justify-between p-2 rounded-lg bg-white/5">
            <span class="text-xs text-gray-400">Issues</span>
            <span id="issue-count" class="text-sm font-semibold">--</span>
          </div>
          <div class="flex items-center justify-between p-2 rounded-lg bg-white/5">
            <span class="text-xs text-gray-400">Commits</span>
            <span id="commit-count" class="text-sm font-semibold">--</span>
          </div>
        </div>
      </div>

      <!-- Trending Section -->
      <div class="glass rounded-xl p-3 flex-shrink-0">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-medium text-gray-300">Trending</h2>
          <a href="https://github.com/trending" target="_blank" class="text-xs text-blue-400 hover:text-blue-300">Open GitHub</a>
        </div>
        <div id="trending" class="space-y-1.5"></div>
      </div>

    </div>

  </div>

  <script>
    // Fallback static data for demo
    const staticActivity = {
      '2026-06-10': 1, '2026-06-11': 2, '2026-06-12': 6, '2026-06-13': 4,
      '2026-06-14': 4, '2026-06-15': 3, '2026-06-16': 2
    };
    const staticRepos = [
      {name: 'github-widget-desktop', desc: 'GitHub dashboard widget', lang: 'JavaScript', stars: 0, issues: 0, pushed: '2026-06-16T12:00:00Z', url: 'https://github.com/benclawbot/github-widget-desktop', private: false},
    ];
    const staticAllRepos = [{name: 'github-widget-desktop', stars: 0, issues: 0}];
    const staticTrending = [
      {name: 'anthropics/anthropic-cookbook', desc: 'Examples for building with Anthropic models', stars: '12.4k', lang: 'Jupyter Notebook', langColor: 'bg-orange-400'},
      {name: 'ollama/ollama', desc: 'Run Llama 3, Mistral locally', stars: '28.5k', lang: 'Go', langColor: 'bg-cyan-500'},
    ];

    let config = { username: 'benclawbot', token: '' };

    function langColor(lang) {
      const colors = {Python: 'bg-blue-500', TypeScript: 'bg-blue-400', Rust: 'bg-orange-500', Go: 'bg-cyan-500', JavaScript: 'bg-yellow-400', HTML: 'bg-orange-400', Dart: 'bg-cyan-400', 'Jupyter Notebook': 'bg-orange-400'};
      return colors[lang] || 'bg-gray-400';
    }

    function timeAgo(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
      return Math.floor(diff / 604800) + 'w ago';
    }

    function esc(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getActivityColor(count) {
      if (count === 0) return 'bg-[#161b22]';
      if (count <= 3) return 'bg-emerald-900';
      if (count <= 6) return 'bg-emerald-700';
      if (count <= 10) return 'bg-emerald-500';
      return 'bg-emerald-400';
    }

    function buildActivityMap(eventsByDate) {
      const container = document.getElementById('activity-map');
      const monthLabels = document.getElementById('month-labels');
      const tooltip = document.getElementById('tooltip');
      const endDate = new Date();
      const startDate = new Date(endDate);
      startDate.setDate(endDate.getDate() - 130);
      const cellWidth = 11;
      const allDays = [];
      const current = new Date(startDate);

      while (current <= endDate) {
        const dateStr = current.toISOString().split('T')[0];
        allDays.push({ date: dateStr, count: eventsByDate[dateStr] || 0, month: current.getMonth() });
        current.setDate(current.getDate() + 1);
      }

      const today = new Date().toISOString().split('T')[0];
      document.getElementById('activity-dates').textContent = `${allDays[0].date} — ${today}`;

      monthLabels.innerHTML = '';
      let currentMonth = -1, monthStartIndex = 0;
      allDays.forEach((day, i) => {
        if (day.month !== currentMonth) {
          if (currentMonth !== -1) {
            const span = document.createElement('span');
            span.textContent = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][currentMonth];
            span.style.position = 'absolute';
            span.style.left = monthStartIndex * cellWidth + 'px';
            span.className = 'text-xs text-gray-500';
            monthLabels.appendChild(span);
          }
          currentMonth = day.month;
          monthStartIndex = i;
        }
      });
      const lastSpan = document.createElement('span');
      lastSpan.textContent = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][currentMonth];
      lastSpan.style.position = 'absolute';
      lastSpan.style.left = monthStartIndex * cellWidth + 'px';
      lastSpan.className = 'text-xs text-gray-500';
      monthLabels.appendChild(lastSpan);
      monthLabels.style.position = 'relative';
      monthLabels.style.height = '16px';

      container.innerHTML = '';
      allDays.forEach(day => {
        const div = document.createElement('div');
        div.className = 'w-2.5 h-2.5 rounded-sm activity-cell ' + getActivityColor(day.count);
        div.addEventListener('mouseenter', () => {
          const date = new Date(day.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          const commits = day.count === 1 ? '1 commit' : day.count + ' commits';
          tooltip.textContent = date + ' — ' + commits;
          tooltip.classList.add('visible');
          const rect = div.getBoundingClientRect();
          tooltip.style.left = (rect.left + rect.width / 2 - tooltip.offsetWidth / 2) + 'px';
          tooltip.style.top = (rect.top - tooltip.offsetHeight - 5) + 'px';
        });
        div.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
        container.appendChild(div);
      });
    }

    function buildActiveRepos(repos) {
      const container = document.getElementById('active-repos');
      document.getElementById('active-count').textContent = repos.length;
      container.innerHTML = '';
      repos.forEach(repo => {
        const card = document.createElement('a');
        card.href = repo.url;
        card.target = '_blank';
        card.className = 'repo-card block px-2 py-1.5 rounded-lg bg-white/5 border border-white/5 hover:border-blue-500/30';
        const langHtml = repo.lang ? '<span class="w-1.5 h-1.5 rounded-full ' + esc(langColor(repo.lang)) + '"></span><span class="text-xs text-gray-400">' + esc(repo.lang) + '</span>' : '';
        const privateBadge = repo.private ? '<span class="text-xs px-1 py-0.5 rounded bg-yellow-500/20 text-yellow-400">🔒</span>' : '';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="text-xs font-medium text-blue-400 truncate">${esc(repo.name)}</span>
              ${privateBadge}
            </div>
            <span class="text-xs text-gray-500 flex-shrink-0 ml-1">${esc(timeAgo(repo.pushed))}</span>
          </div>
          ${repo.desc ? '<p class="text-xs text-gray-500 truncate mt-0.5">' + esc(repo.desc) + '</p>' : ''}
          ${langHtml ? '<div class="flex items-center gap-1 mt-1">' + langHtml + '</div>' : ''}
        `;
        container.appendChild(card);
      });
    }

    function buildStats(repos) {
      const totalStars = repos.reduce((sum, r) => sum + (r.stars || 0), 0);
      const totalIssues = repos.reduce((sum, r) => sum + (r.issues || 0), 0);
      document.getElementById('repo-count').textContent = repos.length;
      document.getElementById('star-count').textContent = totalStars;
      document.getElementById('issue-count').textContent = totalIssues;
    }

    function buildTrending(trendingRepos) {
      const container = document.getElementById('trending');
      container.innerHTML = '';
      (trendingRepos || []).forEach(repo => {
        const card = document.createElement('a');
        card.href = repo.html_url || 'https://github.com/' + repo.full_name;
        card.target = '_blank';
        card.className = 'trend-card flex items-center gap-2 p-2 rounded-lg bg-white/5 border border-white/5';
        card.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-medium text-white truncate">${esc(repo.name || repo.full_name?.split('/')[1])}</span>
            </div>
            <div class="flex items-center gap-2 mt-0.5">
              <div class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full ${esc(repo.lang ? langColor(repo.lang) : 'bg-gray-400')}"></span><span class="text-xs text-gray-500">${esc(repo.lang || 'Unknown')}</span></div>
              <div class="flex items-center gap-0.5 text-yellow-400"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span class="text-xs">${esc(String(repo.stargazers_count > 999 ? (repo.stargazers_count/1000).toFixed(1) + 'k' : repo.stargazers_count))}</span></div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function loadData() {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('spin');

      try {
        const data = await window.electronAPI.fetchGitHubData(config);
        if (data.error) throw new Error(data.error);

        // Process events into daily commit counts
        const eventsByDate = {};
        let totalCommits = 0;
        (data.events || []).forEach(event => {
          if (event.type === 'PushEvent') {
            const date = event.created_at.split('T')[0];
            const count = (event.payload?.commits || []).length;
            eventsByDate[date] = (eventsByDate[date] || 0) + count;
            totalCommits += count;
          }
        });

        // Process repos
        const activeRepos = (data.repos || []).slice(0, 11).map(r => ({
          name: r.name,
          desc: r.description || '',
          lang: r.language,
          stars: r.stargazers_count,
          issues: r.open_issues_count,
          pushed: r.pushed_at,
          url: r.html_url,
          private: r.private
        }));

        const allRepos = data.repos || [];

        buildActivityMap(eventsByDate);
        buildActiveRepos(activeRepos);
        buildStats(allRepos);
        buildTrending(data.trending?.items || []);

        document.getElementById('commit-count').textContent = totalCommits.toLocaleString();
      } catch (err) {
        console.error('Failed to load GitHub data:', err);
        // Fallback to static data
        buildActivityMap(staticActivity);
        buildActiveRepos(staticRepos);
        buildStats(staticAllRepos);
        buildTrending(staticTrending);
        document.getElementById('commit-count').textContent = '?';
      }

      setTimeout(() => icon.classList.remove('spin'), 800);
    }

    // Config panel
    document.getElementById('btn-config').addEventListener('click', () => {
      document.getElementById('input-username').value = config.username;
      document.getElementById('input-token').value = config.token;
      document.getElementById('config-panel').classList.add('open');
    });
    document.getElementById('btn-config-close').addEventListener('click', () => {
      document.getElementById('config-panel').classList.remove('open');
    });
    document.getElementById('btn-save-config').addEventListener('click', () => {
      config.username = document.getElementById('input-username').value.trim() || 'benclawbot';
      config.token = document.getElementById('input-token').value.trim();
      localStorage.setItem('gh-widget-config', JSON.stringify(config));
      document.getElementById('config-panel').classList.remove('open');
      loadData();
    });

    // Title bar buttons
    document.getElementById('btn-refresh').addEventListener('click', loadData);
    document.getElementById('btn-minimize').addEventListener('click', () => window.electronAPI.minimize());
    document.getElementById('btn-close').addEventListener('click', () => window.electronAPI.close());

    // Load saved config
    const saved = localStorage.getItem('gh-widget-config');
    if (saved) {
      try { config = JSON.parse(saved); } catch {}
    }

    // Initial load
    loadData();
  </script>
</body>
</html>
